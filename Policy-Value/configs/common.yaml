# 通用配置（Policy-Value）

dataDir: Data
dataSetName: HSI  # DJI | HSI | FCHI | SP500 | N225 | KS11

time:
  train_startingDate: "2012-01-01"
  train_endingDate: "2021-12-31"
  test_startingDate: "2022-01-01"
  test_endingDate: "2024-12-31"

agent:
  algorithm: PPO  # PPO | DDQN | A2C | SAC

input:
  length: 20

system:
  device: auto
  seed: 1

train:
  init_money: 500000
  batch_size: 128
  buffer_size: 100000
  total_env_steps: 200000
  eval_every_steps: 10000
  learning_starts: 2000
  train_freq: 1
  gradient_steps: 1
  target_update: 1000
  save_best_by: PnL
  random_reset: true

# 实验名：用于结果落盘目录 result/<expName>/<AgentName>/
expName: PPO-HSI-cuda312-greedyval
