[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "validation-aligned-intervention-transfer"
version = "0.1.0"
description = "Held-out intervention audit for explanation portability in financial reinforcement learning"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pandas>=2.2",
  "pillow>=10",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "tabulate>=0.9",
  "torch>=2.5",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["TradingCircuitDiscovery*"]
